
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 2</title>

    <style>
        p {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <p id="demo"></p>

    <script>
        var font_size = 5;
        var p = document.getElementById("demo");
        var grow = setInterval(growing, 100);

        p.innerHTML = "TEXT-GROWING";
        p.style.fontSize = font_size + "pt";
        p.style.color = "red";

        function growing() {
            font_size += 1;

            p.innerHTML = "TEXT-GROWING";
            p.style.fontSize = font_size + "pt";
            p.style.color = "red";

            if (font_size >= 50) {
                clearInterval(grow);

                p.innerHTML = "TEXTSHRINKING";
                p.style.color = "blue";

                var shrink = setInterval(shrinking, 100);
            }
        }

        function shrinking() {
            font_size -= 1;

            p.innerHTML = "TEXTSHRINKING";
            p.style.fontSize = font_size + "pt";
            p.style.color = "blue";

            if (font_size <= 5) {
                clearInterval(shrink);
                grow = setInterval(growing, 100);
            }
        }
    </script>

</body>
</html>
