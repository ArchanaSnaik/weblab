<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Calculator</title>

	<style>
		body {
			background-color: lightgrey;
			font-family: Arial;
			padding: 250px;
			display: flex;
            justify-content: center;
		}

		.myCalc {
			width: 260px;
			height: auto;
			border: 2px solid black;
			padding: 16px;
			background-color: skyblue;
			border-radius: 8px;
			align-content: center;
			box-sizing: border-box;
		}

		h2 {
			text-align: center;
		}

 		input, select, button {
            padding: 8px;
            margin-bottom: 12px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            background-color: grey;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }



	</style>

</head>
<body>
	<div class="myCalc">
		<h2>Calculator</h2>

		<input type="number" id="firstNumber" placeholder="Enter First Number">

		<select id="operator">
			<option value="+">Addition</option>
			<option value="-">Subtraction</option>
			<option value="*">Multiplication</option>
			<option value="/">Division</option>
		</select>

		<input type="number" id="secondNumber" placeholder="Enter Second Number">

		<button onclick="calculate()">Calculate</button>

		<div id="calculatedResult"></div>

	</div>

	<script>
		function calculate() {

			var firstNumber = parseFloat(document.getElementById("firstNumber").value);
			var secondNumber = parseFloat(document.getElementById("secondNumber").value);
			var operator = document.getElementById("operator").value;
			var result;

			if(isNaN(firstNumber) || isNaN(secondNumber)) {
				document.getElementById("calculatedResult").innerText = "Please Enter Both Numbers";
				return;
			}

			if(operator == "+") {
				result = firstNumber + secondNumber;
			}
			else if (operator == "-") {
				result = firstNumber - secondNumber;
			}
			else if (operator == "*") {
				result = firstNumber * secondNumber;
			}
			else if (operator == "/") {
				if (secondNumber == 0) {
					document.getElementById("calculatedResult").innerText = "Can't divided by zero";
					return;
				}
				result = firstNumber / secondNumber;
			}

			document.getElementById("calculatedResult").innerText = "Result:" + result;
		}
	</script>

</body>
</html>
